name: Verify placement profiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-placement-profiles.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check worker.js
      - name: Singapore dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.scratch.sg.toml --outdir /tmp/sg
      - name: Hong Kong dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.scratch.hkg.toml --outdir /tmp/hkg
