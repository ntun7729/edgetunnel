name: Verify scratch Cloudflare fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-scratch-cf-fallback.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Xray
        run: |
          set -euxo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray
      - name: Start Workers
        run: |
          set -euxo pipefail
          nohup npx --yes wrangler@latest dev --config wrangler.scratch.toml --ip 127.0.0.1 --port 8787 --var UUID:00112233-4455-6677-8899-aabbccddeeff --var DEBUG:true --var CF_FALLBACK:auto > /tmp/auto-worker.log 2>&1 &
          nohup npx --yes wrangler@latest dev --config wrangler.scratch.toml --ip 127.0.0.1 --port 8788 --var UUID:00112233-4455-6677-8899-aabbccddeeff --var DEBUG:true --var CF_FALLBACK:force > /tmp/force-worker.log 2>&1 &
          for port in 8787 8788; do
            for i in $(seq 1 60); do
              curl -fsS "http://127.0.0.1:${port}/health?detail=1" >/tmp/health-${port}.txt 2>/dev/null && break
              sleep 1
            done
            cat /tmp/health-${port}.txt
            grep -q 'connector=request.fetcher.connect' /tmp/health-${port}.txt
          done
      - name: Start Xray clients
        run: |
          cat >/tmp/make-xray.sh <<'SH'
          make_cfg() {
            local socks=$1 worker=$2 file=$3
            cat >"$file" <<JSON
          {
            "log":{"loglevel":"warning"},
            "inbounds":[{"listen":"127.0.0.1","port":${socks},"protocol":"socks","settings":{"udp":true}}],
            "outbounds":[{
              "protocol":"vless",
              "settings":{"vnext":[{"address":"127.0.0.1","port":${worker},"users":[{"id":"00112233-4455-6677-8899-aabbccddeeff","encryption":"none"}]}]},
              "streamSettings":{"network":"ws","security":"none","wsSettings":{"path":"/vless"}},
              "mux":{"enabled":false}
            }]
          }
          JSON
          }
          SH
          source /tmp/make-xray.sh
          make_cfg 10808 8787 /tmp/auto-xray.json
          make_cfg 10809 8788 /tmp/force-xray.json
          nohup /tmp/xray/xray run -config /tmp/auto-xray.json >/tmp/auto-xray.log 2>&1 &
          nohup /tmp/xray/xray run -config /tmp/force-xray.json >/tmp/force-xray.log 2>&1 &
          sleep 2
      - name: Test auto and forced anycast
        run: |
          set -euxo pipefail
          for url in https://www.cloudflare.com/ https://one.one.one.one/ https://speed.cloudflare.com/; do
            curl -L -fsS -o /dev/null --max-time 15 --socks5-hostname 127.0.0.1:10808 "$url"
            curl -L -fsS -o /dev/null --max-time 15 --socks5-hostname 127.0.0.1:10809 "$url"
          done
          echo '--- AUTO WORKER ---'
          cat /tmp/auto-worker.log
          echo '--- FORCE WORKER ---'
          cat /tmp/force-worker.log
          grep -q 'cf-anycast-force' /tmp/force-worker.log
