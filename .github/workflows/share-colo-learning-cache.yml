name: Share colo learning cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/share-colo-learning-cache.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply shared-cache patch
        run: |
          set -euxo pipefail
          python3 tools/share_colo_learning_cache.py
          node --check worker.js
          git diff --check
          grep -q 'hydrateCfPerfShared' worker.js
          grep -q 'persistCfPerfShared' worker.js
          grep -q 'persistSharedRoute' worker.js
          grep -q 'learning_scope=colo-local-cache' worker.js

      - name: Wrangler dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.scratch.toml --outdir /tmp/scratch-build

      - name: Install Xray
        run: |
          set -euxo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray

      - name: Start Worker with persistent local cache
        run: |
          set -euxo pipefail
          cp wrangler.scratch.toml /tmp/wrangler-cache.toml
          sed -i 's#main = "worker.js"#main = "'"$(pwd)"'/worker.js"#' /tmp/wrangler-cache.toml
          nohup npx --yes wrangler@latest dev --config /tmp/wrangler-cache.toml --ip 127.0.0.1 --port 8788 --persist-to /tmp/wrangler-state \
            --var UUID:00112233-4455-6677-8899-aabbccddeeff \
            --var CONFIG_TOKEN:diag \
            --var DEBUG:true \
            --var CF_FALLBACK:auto \
            --var CF_FALLBACK_IPS:104.16.0.1,104.17.0.1,104.18.0.1 \
            --var CF_EXPLORE_EVERY:2 \
            --var CONNECT_RACE:2 > /tmp/worker1.log 2>&1 &
          echo $! >/tmp/worker.pid
          for i in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:8788/health?detail=1' >/tmp/health1.txt 2>/dev/null && break
            sleep 1
          done
          cat /tmp/health1.txt
          grep -q 'learning_scope=colo-local-cache' /tmp/health1.txt

      - name: Start Xray and create learned samples
        run: |
          cat >/tmp/xray.json <<'JSON'
          {
            "log":{"loglevel":"warning"},
            "inbounds":[{"listen":"127.0.0.1","port":10809,"protocol":"socks","settings":{"udp":true}}],
            "outbounds":[{
              "protocol":"vless",
              "settings":{"vnext":[{"address":"127.0.0.1","port":8788,"users":[{"id":"00112233-4455-6677-8899-aabbccddeeff","encryption":"none"}]}]},
              "streamSettings":{"network":"ws","security":"none","wsSettings":{"path":"/vless"}},
              "mux":{"enabled":false}
            }]
          }
          JSON
          nohup /tmp/xray/xray run -config /tmp/xray.json >/tmp/xray.log 2>&1 &
          echo $! >/tmp/xray.pid
          sleep 2
          for i in $(seq 1 6); do
            curl -L -fsS -o /dev/null --max-time 20 --socks5-hostname 127.0.0.1:10809 'https://speed.cloudflare.com/__down?bytes=100000'
          done
          sleep 1
          curl -fsS 'http://127.0.0.1:8788/route-stats?token=diag' -o /tmp/stats1.json
          cat /tmp/stats1.json
          jq -e '.scope == "colo-local Cache API + current isolate hot cache"' /tmp/stats1.json
          jq -e '[.candidates[].successes] | add > 0' /tmp/stats1.json

      - name: Restart Worker and verify cache survives isolate/process reset
        run: |
          set -euxo pipefail
          kill $(cat /tmp/xray.pid) || true
          kill $(cat /tmp/worker.pid) || true
          sleep 2
          nohup npx --yes wrangler@latest dev --config /tmp/wrangler-cache.toml --ip 127.0.0.1 --port 8788 --persist-to /tmp/wrangler-state \
            --var UUID:00112233-4455-6677-8899-aabbccddeeff \
            --var CONFIG_TOKEN:diag \
            --var DEBUG:true \
            --var CF_FALLBACK:auto \
            --var CF_FALLBACK_IPS:104.16.0.1,104.17.0.1,104.18.0.1 \
            --var CF_EXPLORE_EVERY:2 \
            --var CONNECT_RACE:2 > /tmp/worker2.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:8788/route-stats?token=diag' >/tmp/stats2.json 2>/dev/null && break
            sleep 1
          done
          cat /tmp/stats2.json
          jq -e '[.candidates[].successes] | add > 0' /tmp/stats2.json
          jq -e '.sharedCache == "enabled"' /tmp/stats2.json

      - name: Commit worker directly to main
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "perf: share Cloudflare learning across colo isolates"
          git push origin HEAD:main
