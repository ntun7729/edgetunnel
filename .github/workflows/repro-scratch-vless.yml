name: Reproduce scratch VLESS with real Xray

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.scratch.toml
      - .github/workflows/repro-scratch-vless.yml

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Xray
        shell: bash
        run: |
          set -euxo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray
          /tmp/xray/xray version

      - name: Start local Worker
        shell: bash
        run: |
          set -euxo pipefail
          nohup npx --yes wrangler@latest dev --config wrangler.scratch.toml --ip 127.0.0.1 --port 8787 --var UUID:00112233-4455-6677-8899-aabbccddeeff --var DEBUG:true > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/health.txt 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/health.txt
          test "$(cat /tmp/health.txt)" = "ok"

      - name: Start Xray client
        shell: bash
        run: |
          cat >/tmp/xray-client.json <<'JSON'
          {
            "log": {"loglevel": "debug"},
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 10808,
                "protocol": "socks",
                "settings": {"udp": true}
              }
            ],
            "outbounds": [
              {
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": "127.0.0.1",
                      "port": 8787,
                      "users": [
                        {
                          "id": "00112233-4455-6677-8899-aabbccddeeff",
                          "encryption": "none"
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": {"path": "/vless"}
                },
                "mux": {"enabled": false}
              }
            ]
          }
          JSON
          nohup /tmp/xray/xray run -config /tmp/xray-client.json > /tmp/xray.log 2>&1 &
          echo $! >/tmp/xray.pid
          sleep 2

      - name: Fetch through VLESS
        shell: bash
        run: |
          set +e
          curl -v --max-time 20 --socks5-hostname 127.0.0.1:10808 https://example.com/ -o /tmp/body.txt 2>/tmp/curl.log
          RC=$?
          set -e
          echo "curl rc=$RC"
          cat /tmp/curl.log
          echo '--- xray log ---'
          cat /tmp/xray.log
          echo '--- worker log ---'
          cat /tmp/worker.log
          test $RC -eq 0
          grep -q 'Example Domain' /tmp/body.txt
