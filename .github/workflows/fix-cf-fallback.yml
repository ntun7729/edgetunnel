name: Fix scratch Cloudflare fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-cf-fallback.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch worker
        run: |
          python3 tools/fix_cf_fallback.py
          node --check worker.js
          git diff --check
          grep -q "172.71.218.190" worker.js
          grep -q "fallbackAttempt" worker.js
          grep -q "replayedThroughId = -1" worker.js
          grep -q "CF fallback candidate failed" worker.js

      - name: Wrangler dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.scratch.toml --outdir /tmp/scratch-build

      - name: Install Xray
        run: |
          set -euxo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray

      - name: Start forced-fallback Worker and Xray
        run: |
          set -euxo pipefail
          cp wrangler.scratch.toml /tmp/wrangler.test.toml
          sed -i 's#main = "worker.js"#main = "'"$(pwd)"'/worker.js"#' /tmp/wrangler.test.toml
          nohup npx --yes wrangler@latest dev --config /tmp/wrangler.test.toml --ip 127.0.0.1 --port 8788 --var UUID:00112233-4455-6677-8899-aabbccddeeff --var DEBUG:true --var CF_FALLBACK:force > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:8788/health?detail=1' >/tmp/health.txt 2>/dev/null && break
            sleep 1
          done
          cat /tmp/health.txt
          grep -q 'connector=request.fetcher.connect' /tmp/health.txt
          cat >/tmp/xray.json <<'JSON'
          {
            "log":{"loglevel":"warning"},
            "inbounds":[{"listen":"127.0.0.1","port":10809,"protocol":"socks","settings":{"udp":true}}],
            "outbounds":[{
              "protocol":"vless",
              "settings":{"vnext":[{"address":"127.0.0.1","port":8788,"users":[{"id":"00112233-4455-6677-8899-aabbccddeeff","encryption":"none"}]}]},
              "streamSettings":{"network":"ws","security":"none","wsSettings":{"path":"/vless"}},
              "mux":{"enabled":false}
            }]
          }
          JSON
          nohup /tmp/xray/xray run -config /tmp/xray.json >/tmp/xray.log 2>&1 &
          sleep 2

      - name: Test Cloudflare destinations
        run: |
          set -euxo pipefail
          for url in https://www.cloudflare.com/ https://one.one.one.one/ https://speed.cloudflare.com/; do
            curl -L -fsS -o /dev/null --max-time 20 --socks5-hostname 127.0.0.1:10809 "$url"
          done
          cat /tmp/worker.log
          grep -q 'CF fallback' /tmp/worker.log

      - name: Commit worker directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "fix: make Cloudflare fallback resilient"
          git push origin HEAD:main
