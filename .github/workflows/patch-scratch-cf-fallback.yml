name: Patch scratch VLESS Cloudflare fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-scratch-cf-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fallback patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()

          s = s.replace(
          "const MAX_BUFFERED_AMOUNT = 8 * 1024 * 1024;\n",
          "const MAX_BUFFERED_AMOUNT = 8 * 1024 * 1024;\nconst CF_FALLBACK_IPS = ['104.16.0.1', '104.17.0.1', '104.18.0.1'];\nconst DEFAULT_CF_FIRST_BYTE_MS = 1200;\nconst MAX_REPLAY_BYTES = 1024 * 1024;\n",
          1)

          anchor = """function getConnector(request) {\n  const requestFetcher = request?.fetcher;\n  if (requestFetcher && typeof requestFetcher.connect === 'function') {\n    return (target) => requestFetcher.connect(target);\n  }\n  return (target, options) => connect(target, options);\n}\n"""
          replacement = anchor + """\nfunction hasRequestFetcher(request) {\n  return Boolean(request?.fetcher && typeof request.fetcher.connect === 'function');\n}\n\nfunction selectCfFallback(host, attempt = 0) {\n  let hash = 2166136261;\n  const text = String(host || 'cf');\n  for (let i = 0; i < text.length; i++) {\n    hash ^= text.charCodeAt(i);\n    hash = Math.imul(hash, 16777619) >>> 0;\n  }\n  return CF_FALLBACK_IPS[(hash + attempt) % CF_FALLBACK_IPS.length];\n}\n"""
          if anchor not in s:
              raise SystemExit('getConnector anchor missing')
          s = s.replace(anchor, replacement, 1)

          start = s.index('async function handleTcpSession(')
          end = s.index('\nfunction appendUdpBuffer', start)
          new_tcp = r'''async function handleTcpSession({ ws, connector, requestMeta, initialPayload, version, host, port, config, log }) {
  let closed = false;
  let socket = null;
  let writer = null;
  let reader = null;
  let generation = 0;
  let firstByteSeen = false;
  let firstByteTimer = null;
  let fallbackAttempted = false;
  let switching = false;
  let switchPromise = Promise.resolve();
  let uplink = Promise.resolve();
  let doneResolve;
  const done = new Promise((resolve) => { doneResolve = resolve; });
  const replay = [];
  let replayBytes = 0;
  let nextChunkId = 0;
  let replayedThroughId = -1;

  const canCfFallback = requestMeta.supportsCloudflareFallback && port === 443 && config.cfFallbackMode !== 'off';
  const forceCfFallback = canCfFallback && config.cfFallbackMode === 'force';

  const idle = createIdleWatchdog(config.idleTimeoutMs, () => {
    log('idle timeout', `${host}:${port}`);
    closeAll(1000, 'idle timeout');
  });

  const clearFirstByteTimer = () => {
    if (firstByteTimer) clearTimeout(firstByteTimer);
    firstByteTimer = null;
  };

  const closeCurrent = () => {
    clearFirstByteTimer();
    try { reader?.cancel(); } catch {}
    try { reader?.releaseLock(); } catch {}
    try { writer?.releaseLock(); } catch {}
    try { socket?.close(); } catch {}
    reader = null;
    writer = null;
    socket = null;
  };

  const closeAll = (code = 1000, reason = '') => {
    if (closed) return;
    closed = true;
    idle.stop();
    generation++;
    closeCurrent();
    safeWsClose(ws, code, reason);
    doneResolve?.();
  };

  const rememberChunk = (chunk) => {
    const bytes = toBytes(chunk);
    const copy = bytes.slice();
    const item = { id: nextChunkId++, bytes: copy };
    if (!firstByteSeen && replayBytes + copy.byteLength <= MAX_REPLAY_BYTES) {
      replay.push(item);
      replayBytes += copy.byteLength;
    }
    return item;
  };

  const markFirstByte = () => {
    if (firstByteSeen) return;
    firstByteSeen = true;
    clearFirstByteTimer();
    replay.length = 0;
    replayBytes = 0;
  };

  const startDownlink = (myGeneration, isFallback) => {
    const myReader = reader;
    (async () => {
      try {
        while (!closed && myGeneration === generation) {
          const { value, done: streamDone } = await myReader.read();
          if (streamDone) {
            if (!firstByteSeen && !isFallback && canCfFallback) {
              await triggerCfFallback('direct EOF before first byte');
            } else if (myGeneration === generation) {
              closeAll(1000, 'remote closed');
            }
            return;
          }
          if (!value?.byteLength) continue;
          if (myGeneration !== generation || closed) return;
          markFirstByte();
          idle.arm();
          await waitForWsBackpressure(ws);
          sendWs(ws, value);
        }
      } catch (error) {
        if (closed || myGeneration !== generation) return;
        if (!firstByteSeen && !isFallback && canCfFallback) {
          try {
            await triggerCfFallback(`direct read failed: ${error?.message || error}`);
            return;
          } catch {}
        }
        log('downlink failed', error?.message || error);
        closeAll(1011, 'downlink failed');
      } finally {
        try { myReader.releaseLock(); } catch {}
      }
    })();
  };

  const openTarget = async (targetHost, label, isFallback) => {
    const myGeneration = ++generation;
    const newSocket = await connectWithTimeout(connector, targetHost, port, config.connectTimeoutMs);
    if (closed || myGeneration !== generation) {
      try { newSocket.close(); } catch {}
      throw new Error('connection superseded');
    }
    socket = newSocket;
    writer = socket.writable.getWriter();
    reader = socket.readable.getReader();
    log('TCP connected', `${host}:${port}`, requestMeta.connectorName, label, targetHost);
    startDownlink(myGeneration, isFallback);
    return myGeneration;
  };

  const writeReplay = async () => {
    let i = 0;
    while (!closed && i < replay.length) {
      const item = replay[i++];
      await writer.write(item.bytes);
      replayedThroughId = Math.max(replayedThroughId, item.id);
    }
  };

  async function triggerCfFallback(reason) {
    if (!canCfFallback || fallbackAttempted || firstByteSeen || closed) {
      throw new Error('Cloudflare fallback unavailable');
    }
    fallbackAttempted = true;
    switching = true;
    clearFirstByteTimer();
    generation++;
    closeCurrent();
    const fallbackIp = selectCfFallback(host, 0);
    log('CF fallback', reason, `${host}:${port}`, 'via', fallbackIp);
    switchPromise = (async () => {
      await openTarget(fallbackIp, 'cf-anycast', true);
      await writeReplay();
      switching = false;
      idle.arm();
    })().catch((error) => {
      switching = false;
      log('CF fallback failed', error?.message || error);
      closeAll(1011, 'Cloudflare fallback failed');
      throw error;
    });
    return switchPromise;
  }

  const queueUplink = (chunk) => {
    const bytes = toBytes(chunk);
    if (!bytes.byteLength || closed) return uplink;
    const item = rememberChunk(bytes);
    const queuedGeneration = generation;
    idle.arm();
    uplink = uplink.then(async () => {
      if (closed) return;
      if (switching) {
        await switchPromise;
        if (item.id <= replayedThroughId) return;
      }
      if (queuedGeneration !== generation && item.id <= replayedThroughId) return;
      if (!writer) throw new Error('TCP writer unavailable');
      await writer.write(item.bytes);
    }).catch((error) => {
      if (!closed) {
        log('uplink failed', error?.message || error);
        closeAll(1011, 'uplink failed');
      }
      throw error;
    });
    return uplink;
  };

  if (initialPayload?.byteLength) rememberChunk(initialPayload);

  try {
    if (forceCfFallback) {
      fallbackAttempted = true;
      const fallbackIp = selectCfFallback(host, 0);
      await openTarget(fallbackIp, 'cf-anycast-force', true);
    } else {
      try {
        await openTarget(host, 'direct', false);
      } catch (error) {
        if (!canCfFallback) throw error;
        fallbackAttempted = false;
        await triggerCfFallback(`direct connect failed: ${error?.message || error}`);
      }
    }

    sendWs(ws, makeVlessResponseHeader(version));
    idle.arm();

    if (!switching && writer && replay.length) await writeReplay();
    else if (switching) await switchPromise;

    if (!firstByteSeen && canCfFallback && !forceCfFallback && !fallbackAttempted) {
      firstByteTimer = setTimeout(() => {
        if (!closed && !firstByteSeen && !fallbackAttempted) {
          triggerCfFallback(`${config.cfFirstByteMs}ms without first byte`).catch(() => {});
        }
      }, config.cfFirstByteMs);
    }
  } catch (error) {
    closeAll(1011, error?.message || 'TCP connect failed');
    throw error;
  }

  return { queueUplink, closeAll, done };
}
'''
          s = s[:start] + new_tcp + s[end:]

          old_cfg = """    connectTimeoutMs: clampInteger(env.CONNECT_TIMEOUT_MS, DEFAULT_CONNECT_TIMEOUT_MS, 500, 15000),\n    idleTimeoutMs: clampInteger(env.IDLE_TIMEOUT_MS, DEFAULT_IDLE_TIMEOUT_MS, 10000, 600000),\n    publicHost: normalizePublicHost(env.HOST || url.host),\n"""
          new_cfg = """    connectTimeoutMs: clampInteger(env.CONNECT_TIMEOUT_MS, DEFAULT_CONNECT_TIMEOUT_MS, 500, 15000),\n    idleTimeoutMs: clampInteger(env.IDLE_TIMEOUT_MS, DEFAULT_IDLE_TIMEOUT_MS, 10000, 600000),\n    cfFirstByteMs: clampInteger(env.CF_FIRST_BYTE_MS, DEFAULT_CF_FIRST_BYTE_MS, 250, 5000),\n    cfFallbackMode: ['auto', 'off', 'force'].includes(String(env.CF_FALLBACK || 'auto').toLowerCase())\n      ? String(env.CF_FALLBACK || 'auto').toLowerCase()\n      : 'auto',\n    publicHost: normalizePublicHost(env.HOST || url.host),\n"""
          if old_cfg not in s:
              raise SystemExit('config anchor missing')
          s = s.replace(old_cfg, new_cfg, 1)

          old_meta = """  const requestMeta = {\n    connectorName: request?.fetcher && typeof request.fetcher.connect === 'function' ? 'request.fetcher.connect' : 'cloudflare:sockets',\n  };\n"""
          new_meta = """  const requestMeta = {\n    connectorName: hasRequestFetcher(request) ? 'request.fetcher.connect' : 'cloudflare:sockets',\n    supportsCloudflareFallback: hasRequestFetcher(request),\n  };\n"""
          if old_meta not in s:
              raise SystemExit('requestMeta anchor missing')
          s = s.replace(old_meta, new_meta, 1)

          old_health = "    if (url.pathname === '/health') return textResponse(users.length ? 'ok' : 'misconfigured', users.length ? 200 : 503);\n"
          new_health = """    if (url.pathname === '/health') {\n      const healthy = users.length > 0;\n      if (url.searchParams.get('detail') === '1') {\n        const connectorName = hasRequestFetcher(request) ? 'request.fetcher.connect' : 'cloudflare:sockets';\n        return textResponse(`${healthy ? 'ok' : 'misconfigured'}\\nconnector=${connectorName}\\ncf_fallback=${config.cfFallbackMode}\\ncf_first_byte_ms=${config.cfFirstByteMs}`, healthy ? 200 : 503);\n      }\n      return textResponse(healthy ? 'ok' : 'misconfigured', healthy ? 200 : 503);\n    }\n"""
          if old_health not in s:
              raise SystemExit('health anchor missing')
          s = s.replace(old_health, new_health, 1)

          p.write_text(s)
          PY
          node --check worker.js
          git diff --check
          grep -q "CF_FALLBACK_IPS" worker.js
          grep -q "triggerCfFallback" worker.js
          grep -q "connector=.*request.fetcher.connect" worker.js || true

      - name: Wrangler dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.scratch.toml --outdir /tmp/scratch-build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "fix: retry stalled Cloudflare TLS through anycast"
          git push origin HEAD:main
