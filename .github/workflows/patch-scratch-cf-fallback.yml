name: Patch scratch VLESS Cloudflare fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-scratch-cf-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fallback patch
        run: |
          python3 tools/patch_scratch_cf_fallback.py
          node --check worker.js
          git diff --check
          grep -q "CF_FALLBACK_IPS" worker.js
          grep -q "triggerCfFallback" worker.js
      - name: Wrangler dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.scratch.toml --outdir /tmp/scratch-build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "fix: retry stalled Cloudflare TLS through anycast"
          git push origin HEAD:main
